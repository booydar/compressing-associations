# Experiment configuration - CAN BE MODIFIED by the autoresearch model
# Targets RMM v5p1 (parallel-prefill, ortho rotation off): run_rmm_on_kv_retrieval-v5p1.py

max_steps: 25000  # MUST BE UNDER 25000
eval_steps: 500
logging_steps: 500
warmup_steps: 10000
early_stopping_patience: 20

# Model architecture parameters
n_layer: 4   # DO NOT INCREASE - MUST BE 4 OR FEWER
n_head: 4
n_embd: 128  # DO NOT INCREASE - MUST BE 128 OR FEWER

# Task parameters
n_keys: 2
n_values: 2
# v5p1 uses tokens_per_segment directly; pairs_per_segment is unused.
tokens_per_segment: 1
pairs_per_segment: 0

# Training parameters
base_model: llama
batch_size: 64   # DO NOT CHANGE THIS VALUE
em_threshold: 0.95
learning_rate: 3e-4

# RMM v5p1 memory path (pool writer + unpool reader; pool-1tps regime)
num_memory_vectors: 4
write_mode: cross_attn
read_mode: unpool
write_residual: false
# write_value_dim is the GDN hidden width — UNLOCKED capacity knob (state_size still <=32).
# Defaults to n_embd if unset. Planner may set 128/192/256/384.
write_value_dim: 512

# RMM / GDN parameters
fla_layer: GatedDeltaNet
state_size: 32   # MUST BE 32 OR FEWER
expand_v: 2.0
conv_kernel: 4
