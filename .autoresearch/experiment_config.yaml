# Experiment configuration - CAN BE MODIFIED by the autoresearch model
# Current iteration: iter_247 (Adam optimizer, Human direction #1 - Systematic Training Hyperparameter Exploration)

max_steps: 25000
eval_steps: 500
logging_steps: 500
warmup_steps: 2500
early_stopping_patience: 20

# Model architecture parameters
n_layer: 6
n_head: 4
n_embd: 128

# Task parameters
n_keys: 2
n_values: 2
pairs_per_segment: 8

# Training parameters
base_model: llama
learning_rate: 0.0001
batch_size: 128
em_threshold: 0.95

# Memory tokens configuration
n_mem_tokens:
  values: [8, 16, 32, 64, 128, 256]
  default: 64
