# Experiment configuration - CAN BE MODIFIED by the autoresearch model
# Current iteration: iter_247 (Adam optimizer, Human direction #1 - Systematic Training Hyperparameter Exploration)

max_steps: 25000
eval_steps: 500
logging_steps: 500
warmup_ratio:
  values: [0.05, 0.1, 0.2]
warmup_steps: 2500
early_stopping_patience: 20

# Model architecture parameters
n_layer: 4
n_head: 4
n_embd: 128
n_mem_tokens: 32

# Task parameters
n_keys: 2
n_values: 2
pairs_per_segment: 4

# Training parameters
base_model: llama
lr: 1e-4
learning_rate: 0.01
warmup_ratio: 0.1
batch_size: 128
em_threshold: 0.5

# Optimizer configuration
optimizer: adam
betas: [0.9, 0.95]
weight_decay: 0.01