# Experiment configuration - CAN BE MODIFIED by the autoresearch model
# Current iteration: iter_247 (Adam optimizer, Human direction #1 - Systematic Training Hyperparameter Exploration)

max_steps: 25000
eval_steps: 500
logging_steps: 500
warmup_steps: 2500
early_stopping_patience: 20

# Model architecture parameters
n_layer: 4
n_head: 4
n_embd: 128

# Model flags for deep supervision
use_deep_supervision: true
deep_supervision_weight: 0.1
deep_supervision_layers: [1, 2, 3]

# Task parameters
n_keys: 2
n_values: 2
pairs_per_segment: 4

# Training parameters
base_model: llama
learning_rate: 0.001
batch_size: 128
em_threshold: 0.95

# Optimizer configuration
optimizer: adam
betas: [0.9, 0.95]
weight_decay: 0.01

# Gradient clipping configuration
max_grad_norm:
  values: [0.1, 0.5, 1.0, 2.0]
  default: 1.0

# Memory tokens configuration
n_mem_tokens:
  values: [16, 32, 64, 128]
  default: 64
