# Autoresearch configuration
# Copy .env.template to .env and fill in API keys before running.

llm:

  planner:
    provider: local
    model: llama_local/unsloth/Qwen3.5-122B-A10B-GGUF
    host: 127.0.0.1
    port: 8117
  executor:
    provider: local
    model: llama_local/unsloth/Qwen3.5-122B-A10B-GGUF
    host: 127.0.0.1
    port: 8117

  # planner:
