  #   unsloth/Qwen3.5-27B-Q6K
  #   bartowski/Qwen_Qwen3.5-27B-GGUF
  # executor:
  #   provider: local
  #   model: unsloth/Qwen3.5-27B-Q6K
  #   host: 127.0.0.1
