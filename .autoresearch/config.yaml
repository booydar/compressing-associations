# Autoresearch configuration
# Copy .env.template to .env and fill in API keys before running.

llm:

  planner:
    provider: local
    model: unsloth/Qwen3.5-27B-Q6K
    host: 127.0.0.1
    port: 8117
  executor:
    provider: local
    model: unsloth/Qwen3.5-27B-Q6K
    host: 127.0.0.1
    port: 8117

